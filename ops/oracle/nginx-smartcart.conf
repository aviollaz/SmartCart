# nginx para SmartCart: sirve el frontend estático y hace de reverse proxy a la
# API. Reemplazar TU_DOMINIO antes de instalar.
#
#   sudo cp ops/oracle/nginx-smartcart.conf /etc/nginx/sites-available/smartcart
#   sudo ln -s /etc/nginx/sites-available/smartcart /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d TU_DOMINIO
#
# certbot reescribe este archivo agregando el bloque TLS y la redirección desde
# el 80. O sea que se instala en HTTP, se corre certbot, y él lo deja en HTTPS:
# escribir el bloque 443 a mano acá sería duplicar lo que certbot ya hace.

server {
    listen 80;
    listen [::]:80;
    server_name TU_DOMINIO;

    # El build de Vite (`npm run build` deja frontend/dist).
    root /opt/smartcart/frontend/dist;
    index index.html;

    # La SPA hace routing del lado del cliente: /carrito y /categoria/yerba-mate
    # no son archivos. Sin esto, entrar por URL directa o recargar da 404 — y sólo
    # falla al recargar, que es como se descubre tarde y en producción.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # /optimize corre el solver CP-SAT más las sugerencias semánticas y la
        # heurística de cierre de tienda. El default de 60s es corto para un
        # carrito grande, y un 504 acá se ve igual que un bug de la app.
        proxy_read_timeout 180s;
    }
}
