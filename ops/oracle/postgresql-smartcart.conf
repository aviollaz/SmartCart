# Tuning de Postgres para la VM A1 de Oracle (2 OCPU, 12 GB).
#
#   sudo cp ops/oracle/postgresql-smartcart.conf /etc/postgresql/16/main/conf.d/
#   sudo systemctl restart postgresql
#
# Va en conf.d/ y no editando postgresql.conf: así un upgrade de la distro no
# pisa estos valores ni hay que reconciliar dos archivos.

# ---------------------------------------------------------------------------
# shared_buffers hace DOS cosas, y la segunda es la que no se ve venir.
#
# 1. Es el tamaño que le corresponde a Postgres en una máquina dedicada. La
#    recomendación habitual es 25-40% de la RAM; 4 GB sobre 12 es 33%. El default
#    de la distro (128 MB) está pensado para convivir con otras cosas.
#
# 2. Es lo que impide que Oracle se lleve la máquina. El Always Free recupera
#    instancias ociosas: si durante 7 días corridos el CPU (percentil 95), la red
#    y la memoria están TODOS por debajo del 20%, la reclama. El barrido nocturno
#    no salva a nadie — 30 min por noche son 3,5 h sobre 168, ni mueven el
#    percentil 95. Pero las tres condiciones tienen que cumplirse a la vez, así
#    que alcanza con romper una permanentemente: 4 GB sobre 12 dejan la memoria en
#    33% para siempre.
#
#    La alternativa que circula —un `while true` o un cron que quema CPU para
#    simular actividad— es peor en todo: gasta recursos de verdad, es un proceso
#    más que puede morirse en silencio, y no hace la base más rápida. Acá la
#    mitigación es un efecto lateral de una configuración que había que hacer
#    igual.
# ---------------------------------------------------------------------------
shared_buffers = 4GB

# Cuánta RAM asume el planner que hay para cachear, contando el page cache del SO.
# No reserva nada: sólo cambia decisiones del plan. Con 12 GB y shared_buffers en
# 4, 8 GB es el valor razonable — y sube las chances de que el índice HNSW se
# recorra en memoria, que es lo que hace GET /search.
effective_cache_size = 8GB

# Memoria por operación de orden/hash. El barrido hace upserts masivos y las
# consultas del optimizador ordenan; el default de 4 MB obliga a ir a disco.
# Es POR OPERACIÓN, no global, así que no se sube a lo loco: con un solo worker de
# uvicorn y un barrido por noche, 32 MB es conservador.
work_mem = 32MB

# Para el CREATE INDEX del HNSW y los VACUUM, que son puntuales y se benefician
# de mucha memoria de una.
maintenance_work_mem = 512MB

# Disco de red (block volume), no un SSD local: el costo de un acceso aleatorio
# está mucho más cerca del secuencial que lo que asume el default de 4.0.
random_page_cost = 1.1

# Sólo localhost. La API, el barrido y psql viven en esta misma máquina, así que
# la base no necesita interfaz de red — y lo que no escucha no se puede atacar.
# El 5432 tampoco se abre en la security list de OCI.
listen_addresses = 'localhost'
