# Mantiene despierta la API de la demo pública (Cloud Run) en horario de uso.
#
# El problema: Cloud Run corre con --min-instances 0, o sea que apaga la instancia
# tras ~15 minutos sin tráfico, y la siguiente visita paga el arranque en frío:
# bajar la imagen, importar torch y cargar all-MiniLM-L6-v2. Medido: **29,7 s en
# frío contra 0,25 s en caliente** (ops/demo-publica.md). Esos 30 segundos de
# pantalla vacía son la primera impresión de quien abre el link.
#
# Lo que NO es: no es Neon. La base también se suspende (a los 5 minutos), pero
# despierta en 1-3 s. Mudar la base a otro host no arregla este problema.
#
# **El ping va a `GET /` y a ningún otro endpoint, y eso es lo que lo hace
# gratis.** `GET /` devuelve configuración (modelo cargado, estado del pool,
# analítica) y no consulta la base; con SMARTCART_POOL_MIN_SIZE=0 el pool no
# sostiene conexiones, así que Neon sigue suspendiéndose a los 5 minutos igual que
# sin este workflow y no se gasta un solo CU-hour de los 100 del plan gratuito.
# Apuntarlo a /search, /category/{slug} o /demo-cart "para probar algo más real"
# despertaría la base cada 10 minutos: ~16 horas de cómputo por día, el mes entero
# de Neon en menos de una semana. Si hace falta un chequeo que toque la base, es
# otro workflow y no programado.
#
# Efecto secundario a favor: cada arranque en frío abre una conexión a Neon para
# asegurar el esquema (lifespan de src/api.py), así que menos arranques en frío es
# también menos despertares de la base.
#
# Costo: Actions es gratis en repo público; Cloud Run factura por request, así que
# la instancia ociosa entre pings no se cobra y cada ping son milisegundos de CPU.
#
# Límites, para no esperar de esto lo que no da: el cron de Actions se atrasa bajo
# carga (a veces más de 15 min) y Cloud Run no garantiza cuánto vive una instancia
# ociosa, así que reduce los arranques en frío, no los elimina. De noche se deja
# enfriar a propósito: la primera visita de la mañana todavía puede tardar.
#
# Como todo workflow programado, GitHub lo deshabilita tras 60 días sin commits;
# keepalive.yml cubre a éste igual que a scrape.yml.

name: Mantener caliente la API

on:
  schedule:
    # Cada 10 minutos entre las 08:00 y las 24:00 de Argentina (UTC-3), o sea
    # 11:00-02:59 UTC. Un rango de horas cron no da la vuelta a la medianoche, de
    # ahí los dos tramos. 10 minutos deja margen contra los ~15 de inactividad
    # tras los que Cloud Run apaga la instancia.
    - cron: "*/10 0-2,11-23 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3

    env:
      API_URL: https://smartcart-api-996729163198.us-east1.run.app

    steps:
      # Falla abierto: un ping que no contesta deja una advertencia en la corrida
      # pero no pinta el job de rojo. Corre 100 veces por día, y con la API caída
      # un job que falle mandaría 100 mails; la señal de que la demo está caída es
      # abrirla, no la bandeja de entrada.
      #
      # --max-time 120: si el ping cae justo en un arranque en frío tarda ~30 s, y
      # cortarlo antes no despierta nada.
      - name: GET / (no toca la base)
        run: |
          if curl -fsS --max-time 120 -o /dev/null -w "HTTP %{http_code} en %{time_total}s\n" "$API_URL/"; then
            :
          else
            echo "::warning::La API no contestó el ping ($API_URL/)"
          fi
